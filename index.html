<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>BillsPlan</title>

<!-- iOS: vira app de tela cheia ao adicionar na tela de início -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="BillsPlan">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">

<!-- ícone do app -->
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icon-16.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="./manifest.json">

<style>
  :root{
    --bg:#000; --panel:#0b0b0b; --line:#1f1f1f; --line2:#171717;
    --t1:#fff; --t2:#a3a3a3; --t3:#737373; --t4:#525252;
    --up:#F87171; --down:#4ADE80;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#0a0a0a}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--t1);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  .num{font-variant-numeric:tabular-nums lining-nums;letter-spacing:-0.01em}

  #frame{
    max-width:430px;margin:0 auto;background:var(--bg);
    height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  }

  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + 14px) 20px 4px;flex-shrink:0;
  }
  .brand{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--t4)}
  .tag{font-size:10px;color:#3d3d3d;text-transform:uppercase;letter-spacing:.14em}

  main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:12px}

  #frame{position:relative}
  .topbar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 6px;flex-shrink:0}
  .topbar .ttl{flex:1;font-size:14px;font-weight:500;color:var(--t2)}
  .iconbtn{background:none;border:1px solid var(--line);border-radius:12px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;flex-shrink:0}
  .iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .iconbtn.solid{background:#fff;color:#000;border-color:#fff}
  #veu{position:absolute;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
  #veu.on{opacity:1;pointer-events:auto}
  #menu{position:absolute;top:0;bottom:0;left:0;width:82%;max-width:320px;background:#070707;border-right:1px solid var(--line);
    transform:translateX(-102%);transition:transform .22s ease;z-index:21;overflow-y:auto;padding-bottom:calc(env(safe-area-inset-bottom) + 20px)}
  #menu.on{transform:none}
  @media(prefers-reduced-motion:reduce){#menu,#veu{transition:none}}
  .mhead{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 14px) 14px 10px 20px}
  .mgroup{padding:0 10px;display:flex;flex-direction:column;gap:2px}
  .mitem,.mcat{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-radius:11px;padding:11px 10px;
    color:var(--t2);font-size:14px;font-family:inherit;cursor:pointer;text-align:left}
  .mcat{padding:9px 10px;font-size:13.5px}
  .mitem svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
  .mitem.on{background:#151515;color:#fff}
  .mitem:active,.mcat:active{background:#111}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .kpi{background:none;border:1px solid var(--line);border-radius:14px;padding:13px 14px;text-align:left;color:#fff;font-family:inherit;cursor:pointer}
  .hero{padding:18px;background:linear-gradient(180deg,#0e0e0e,#000)}
  .leg{display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;padding:5px 0;color:var(--t2);font-size:12.5px;font-family:inherit;cursor:pointer}
  .link{background:none;border:0;color:var(--t3);font-size:12px;font-family:inherit;cursor:pointer;margin-top:11px;padding:2px 0}
  .flabel{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--t4);margin:12px 0 7px}
  .chiprow{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .chiprow::-webkit-scrollbar{display:none}
  .chiprow .chip{flex-shrink:0;font-size:11.5px;padding:6px 11px}
  .diahead{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--t4);margin:16px 0 6px}
  .gitem{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line2)}
  .mcards{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
  .mcards::-webkit-scrollbar{display:none}
  .mcard{flex:0 0 auto;min-width:96px;background:none;border:1px solid var(--line);border-radius:11px;padding:9px 10px;color:#fff;font-family:inherit;cursor:pointer;text-align:center}
  .mcard.on{border-color:#fff;background:#111}
  .pill{display:inline-block;font-size:10.5px;color:var(--t2);border:1px solid var(--line);border-radius:99px;padding:1px 7px;margin-right:6px}
  .mini{font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:#4a4a4a}

  .pad{padding-left:20px;padding-right:20px}
  h1{font-size:24px;font-weight:600;letter-spacing:-.02em}
  .sub{font-size:14px;color:var(--t4);margin-top:3px;line-height:1.45}
  .eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.19em;color:var(--t4);font-weight:500}
  .sec{margin-bottom:30px}
  .sechead{display:flex;justify-content:space-between;align-items:baseline;padding:0 20px;margin-bottom:12px}

  .card{border:1px solid var(--line);border-radius:14px;padding:15px}
  .rows{border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .rows>div{display:flex;align-items:center;gap:11px;padding:12px 15px;border-top:1px solid var(--line2)}
  .rows>div:first-child{border-top:0}

  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block}
  .big{font-size:44px;font-weight:650;letter-spacing:-.035em;line-height:1}
  .mid{font-size:32px;font-weight:650;letter-spacing:-.03em}

  .track{height:8px;background:#131313;border-radius:99px;display:flex;overflow:hidden;margin-top:20px}
  .track>span{display:block;height:100%}

  .barline{flex:1;height:3px;background:#151515;border-radius:99px;overflow:hidden}
  .barline>span{display:block;height:100%;border-radius:99px}

  button.tile{
    width:100%;text-align:left;background:none;border:1px solid var(--line);
    border-radius:14px;padding:13px 16px;color:inherit;font-family:inherit;
    display:flex;align-items:center;gap:12px;cursor:pointer;transition:border-color .15s;
  }
  button.tile:active{border-color:#3d3d3d}
  .chev{width:15px;height:15px;stroke:#4a4a4a;fill:none;stroke-width:1.8;flex-shrink:0}

  .scan{
    width:100%;aspect-ratio:4/3;border:1px dashed #3a3a3a;border-radius:20px;
    background:none;color:inherit;font-family:inherit;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;
  }
  .scan:active{border-color:#666}

  .chip{
    font-size:10.5px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);
    background:none;color:var(--t4);font-family:inherit;cursor:pointer;transition:.12s;
  }

  .primary{
    width:100%;background:#fff;color:#000;border:0;border-radius:14px;
    padding:14px;font-size:14.5px;font-weight:500;font-family:inherit;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;
  }
  .primary:active{background:#d4d4d4}

  .ghost{
    width:100%;background:none;border:1px solid #3a3a3a;border-radius:14px;
    padding:12px;color:var(--t2);font-size:14px;font-family:inherit;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;margin-top:20px;
  }

  .seg{display:flex;gap:3px;margin-top:12px}
  .seg>span{height:3px;flex:1;border-radius:99px;background:#1c1c1c}

  .spin{width:22px;height:22px;border:2px solid #333;border-top-color:#bbb;border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){.spin{animation-duration:2s}}

  .fade{animation:fd .25s ease both}
  @keyframes fd{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.fade{animation:none}}

  small.hint{display:block;font-size:11px;color:#4a4a4a;line-height:1.6;margin-top:28px}

  /* formulários e autenticação */
  .field{margin-bottom:13px}
  .field label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.19em;color:var(--t4);margin-bottom:8px;font-weight:500}
  .field input,.field select,.field textarea{
    width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:13px 14px;color:var(--t1);font-size:15px;font-family:inherit;outline:none;
    -webkit-appearance:none;appearance:none;transition:border-color .15s;
  }
  .field input:focus,.field select:focus,.field textarea:focus{border-color:#525252}
  .field input::placeholder,.field textarea::placeholder{color:#3d3d3d}
  .field textarea{resize:none;min-height:72px;line-height:1.5}
  .err{font-size:12px;color:var(--up);margin-top:10px;line-height:1.5}
  .xis{background:none;border:0;color:#3d3d3d;font-size:15px;cursor:pointer;padding:2px 4px;line-height:1;font-family:inherit}
  .xis:active{color:var(--up)}
  .cordot{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;flex-shrink:0}
  .cordot.on{border-color:#fff}

  /* ===================== layout adaptável ===================== */
  .topin{display:flex;align-items:center;gap:10px;width:100%}
  .so-desk{display:none}
  .dash-top,.dash-grid{display:block}

  /* tablet: tela cheia, conteúdo centralizado */
  @media(min-width:640px){
    #frame{max-width:none}
    #app>*{max-width:640px;margin-left:auto;margin-right:auto}
    .topin{max-width:640px;margin:0 auto}
  }

  /* desktop: menu lateral fixo e painel em grade */
  @media(min-width:1024px){
    #frame{display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr}
    #frame.logado{grid-template-columns:264px 1fr}
    #frame.logado #menu{position:relative;transform:none;transition:none;grid-column:1;grid-row:1 / 3;
      width:auto;max-width:none;z-index:auto;padding-bottom:20px}
    #frame.logado #topo{grid-column:2;grid-row:1}
    #frame.logado #app{grid-column:2;grid-row:2;min-height:0}
    #veu{display:none}
    .so-mobile{display:none !important}
    .so-desk{display:inline}

    .topbar{padding:26px 32px 14px}
    .chiprow{flex-wrap:wrap;overflow:visible}
    .topin{max-width:760px;padding:0 20px}
    .iconbtn.lancar{width:auto;padding:0 16px;gap:8px;font-size:13.5px;font-family:inherit;font-weight:500}

    #app{padding:0 32px 32px}
    #app>*{max-width:760px}
    #frame.largo .topin,#frame.largo #app>*{max-width:1180px}

    .mitem:hover,.mcat:hover{background:#101010;color:#fff}
    .kpi:hover,button.tile:hover,.mcard:hover{border-color:#3d3d3d}
    .chip:hover{border-color:#3d3d3d;color:var(--t2)}

    /* painel */
    .hello{padding-top:2px !important}
    .dash-top{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;padding:6px 20px 26px}
    .dash-top>.pad{padding:0 !important}
    .dash-top .hero{height:100%;display:flex;flex-direction:column;justify-content:center;padding:26px}
    .dash-top .big{font-size:56px}
    .dash-top .kpis{gap:12px;height:100%}
    .dash-top .kpi{padding:16px 18px;display:flex;flex-direction:column;justify-content:center}
    .dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 4px;align-items:start}
    .dash-grid .sec.full{grid-column:1 / -1}
  }
</style>
</head>
<body>

<div id="frame">
  <header id="topo" class="topbar"></header>
  <main id="app"></main>
  <div id="veu" data-act="menu-fechar"></div>
  <aside id="menu" aria-label="Menu"></aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
/* =====================================================================
   CONTA — dados reais, salvos na nuvem (Supabase). Login de verdade,
   sincroniza entre aparelhos. Cada pessoa só enxerga os próprios dados
   (Row Level Security no banco).
   ===================================================================== */

const SUPABASE_URL = "https://nyklnencrprtcnrvkwwt.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im55a2xuZW5jcnBydGNucnZrd3d0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5ODk1MTcsImV4cCI6MjEwMjU2NTUxN30.ph9TfCFvDUyq4qevFj8XScMXnmsp0N7ft-9fD79dKE8";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const PALETA = ["#4ADE80","#FB923C","#60A5FA","#C084FC","#FACC15","#22D3EE","#F472B6","#818CF8","#FDBA74","#A3E635","#F87171","#94A3B8"];
const BANCOS = ["Nubank","Itaú","Bradesco","Banco do Brasil","Caixa","Santander","Inter","C6 Bank","Sicredi","Sicoob","PicPay","Outro"];
const CATS_PADRAO = {
  mercado:     {nome:"Mercado",     cor:"#4ADE80"},
  restaurante: {nome:"Restaurante", cor:"#FB923C"},
  transporte:  {nome:"Transporte",  cor:"#60A5FA"},
  casa:        {nome:"Casa",        cor:"#C084FC"},
  lazer:       {nome:"Lazer",       cor:"#FACC15"},
  assinatura:  {nome:"Assinaturas", cor:"#22D3EE"},
  roupas:      {nome:"Roupas",      cor:"#F472B6"},
  sapatos:     {nome:"Sapatos",     cor:"#818CF8"},
  cigarro:     {nome:"Cigarro",     cor:"#FDBA74"},
  outros:      {nome:"Outros",      cor:"#94A3B8"}
};
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const MABR=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const AGORA=new Date(), HOJE=AGORA.getDate(), MES=AGORA.getMonth(), ANO=AGORA.getFullYear();
const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);

/* ------------------------- banco de dados (Supabase) ------------------------- */
function novoDB(){return {user:null,banco:"",cartoes:[],cats:JSON.parse(JSON.stringify(CATS_PADRAO)),
  entradas:[],fixas:[],caixinhas:[],gastos:[],parcelas:[],produtos:[],onboarded:false};}
let DB = novoDB(), CAT = DB.cats;
let UID = null; // id do usuário logado (auth.uid())

/* busca tudo do usuário logado e monta o objeto DB no formato que as telas esperam */
async function buscarTudo(uid){
  return Promise.all([
    sb.from("profiles").select("*").eq("id", uid).maybeSingle(),
    sb.from("categories").select("*").eq("user_id", uid).order("created_at"),
    sb.from("cards").select("*").eq("user_id", uid).order("created_at"),
    sb.from("incomes").select("*").eq("user_id", uid).order("created_at"),
    sb.from("fixed_expenses").select("*").eq("user_id", uid).order("created_at"),
    sb.from("savings").select("*").eq("user_id", uid).order("created_at"),
    sb.from("expenses").select("*").eq("user_id", uid).order("data"),
    sb.from("products").select("*").eq("user_id", uid).order("created_at"),
    sb.from("product_price_history").select("*").eq("user_id", uid).order("data"),
    sb.from("installments").select("*").eq("user_id", uid).order("created_at"),
  ]);
}
async function carregarDoServidor(uid){
  let res = await buscarTudo(uid);
  /* sessão vencida no meio do carregamento: renova o login e busca de novo,
     em vez de mostrar a conta pela metade */
  if(res.some(r=>r.error)){
    try{ await sb.auth.refreshSession(); }catch(err){}
    res = await buscarTudo(uid);
    if(res.some(r=>r.error)) throw res.find(r=>r.error).error;
  }
  const [perfil, cats, cartoes, entradas, fixas, caixinhas, gastos, produtos, hist, parcelas] = res;

  const catsObj = {};
  (cats.data||[]).forEach(c=>{ catsObj[c.chave] = {id:c.id, nome:c.nome, cor:c.cor}; });

  const histPorProduto = {};
  (hist.data||[]).forEach(h=>{ (histPorProduto[h.product_id] ||= []).push({id:h.id, data:ddmm(h.data), mercado:h.mercado, preco:+h.preco}); });

  DB = {
    user: { id:uid, nome: perfil.data?.nome || "" },
    banco: perfil.data?.banco || "",
    onboarded: !!perfil.data?.onboarded,
    cats: Object.keys(catsObj).length ? catsObj : JSON.parse(JSON.stringify(CATS_PADRAO)),
    cartoes: (cartoes.data||[]).map(c=>({id:c.id, nome:c.nome, limite:c.limite==null?0:+c.limite})),
    entradas: (entradas.data||[]).map(e=>({id:e.id, desc:e.descricao, valor:+e.valor, dia:e.dia})),
    fixas: (fixas.data||[]).map(f=>({id:f.id, desc:f.descricao, valor:+f.valor, dia:f.dia, cat:f.cat})),
    caixinhas: (caixinhas.data||[]).map(c=>({id:c.id, desc:c.descricao, aporte:+c.aporte, dia:c.dia})),
    gastos: (gastos.data||[]).map(g=>({id:g.id, desc:g.descricao, valor:+g.valor, cat:g.cat, obs:g.obs||"", cartao:g.cartao||"", data:g.data, semNota:g.sem_nota})),
    produtos: (produtos.data||[]).map(p=>({id:p.id, nome:p.nome, marca:p.marca||"", qtd:+p.qtd||1, hist:histPorProduto[p.id]||[]})),
    parcelas: (parcelas.data||[]).map(p=>({id:p.id, desc:p.descricao||"", valor:+p.valor||0, cartao:p.cartao||"", atual:p.parcela_atual||1, total:p.parcela_total||1})),
  };
  CAT = DB.cats;
}

/* "2026-08-03" -> "03/08" (formato que as telas de preço usam) */
function ddmm(d){ const m=String(d||"").match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}/${m[2]}` : d; }

/* inserção genérica: grava no Supabase e devolve a linha com id */
async function inserir(tabela, linha){
  const { data, error } = await sb.from(tabela).insert({...linha, user_id:UID}).select().single();
  if(error){ throw error; }
  return data;
}
async function remover(tabela, id){
  const { error } = await sb.from(tabela).delete().eq("id", id).eq("user_id", UID);
  if(error) throw error;
}
async function atualizar(tabela, id, campos){
  const { error } = await sb.from(tabela).update(campos).eq("id", id).eq("user_id", UID);
  if(error) throw error;
}

const brl=v=>(isFinite(v)?v:0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
function num(x){
  if(typeof x==="number")return x;
  x=String(x??"").replace(/[^\d,.\-]/g,"");
  if(x.includes(","))x=x.replace(/\./g,"").replace(",",".");
  const v=parseFloat(x);return isFinite(v)?v:0;
}
const esc=t=>String(t??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

/* ------------------------------ estado ------------------------------ */
const S = { view:"boot", tab:"inicio", nota:"inicio", revisando:false, menu:false, fmes:0,
  fg:{mes:"", cats:[], cartoes:[]},
  itens:[], notaLida:null, faturaLida:null, faturaCartao:"", prod:0, form:null,
  tmp:{vals:{},erro:"",banco:"",cor:PALETA[6],gcat:"mercado",ccat:"mercado",volta:false},
  confirmaReset:false };

/* --------------------------- dados derivados --------------------------- */
const somaE=()=>DB.entradas.reduce((s,e)=>s+e.valor,0);
const somaF=()=>DB.fixas.reduce((s,f)=>s+f.valor,0);
const somaC=()=>DB.caixinhas.reduce((s,c)=>s+c.aporte,0);
function gastosMes(){return DB.gastos.map((g,i)=>({...g,_i:i}))
  .filter(g=>{const d=new Date(g.data);return d.getMonth()===MES&&d.getFullYear()===ANO;});}
function porCatMes(){const m={};gastosMes().forEach(g=>{m[g.cat]=(m[g.cat]||0)+g.valor;});
  return Object.entries(m).map(([cat,valor])=>({cat,valor})).sort((a,b)=>b.valor-a.valor);}
function mediaVar(){const m={};DB.gastos.forEach(g=>{const d=new Date(g.data);
  const k=d.getFullYear()+"-"+d.getMonth();m[k]=(m[k]||0)+g.valor;});
  const v=Object.values(m);return v.length?v.reduce((a,b)=>a+b,0)/v.length:0;}
function projecao(){
  if(!DB.entradas.length&&!DB.fixas.length)return null;
  const ent=somaE(),fx=somaF(),cx=somaC(),va=mediaVar();
  return Array.from({length:6},(_,i)=>({mes:MABR[(MES+1+i)%12],ent,fixas:fx,
    parc:DB.parcelas.reduce((s,p)=>s+parcNoMes(p,i+1),0),cx,var:va}));
}
const resultado = p => p.ent - (p.fixas + p.parc + p.cx + p.var);

/* peso na conta: quanto o item comeu do total nos últimos ~90 dias.
   peso = preço × quantidade típica, somado nas compras da janela.
   Já embute a frequência: item barato comprado sempre pesa o que pesa de verdade. */
function peso(p){
  return p.hist.filter(h => +h.data.slice(3) >= MES-1)
               .reduce((s,h) => s + h.preco * (p.qtd||1), 0);
}
const porPeso=()=>DB.produtos.map((p,i)=>({p,i,peso:peso(p)})).sort((a,b)=>b.peso-a.peso);

/* --------------------------- gráfico de linha --------------------------- */
function linha(hist){
  const W=330,H=140,PL=34,PR=8,PT=12,PB=22;
  const ps = hist.map(h=>h.preco);
  const min = Math.min(...ps), max = Math.max(...ps);
  const lo = min - (max-min||1)*0.25, hi = max + (max-min||1)*0.25;
  const x = i => PL + (i/(hist.length-1))*(W-PL-PR);
  const y = v => PT + (1-(v-lo)/(hi-lo))*(H-PT-PB);
  const d = hist.map((h,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(h.preco).toFixed(1)}`).join(" ");
  const grid = [0,.5,1].map(f=>{const yy=PT+f*(H-PT-PB);
    return `<line x1="${PL}" y1="${yy}" x2="${W-PR}" y2="${yy}" stroke="#1a1a1a"/>
            <text x="${PL-6}" y="${yy+3.5}" fill="#4a4a4a" font-size="9" text-anchor="end" font-family="system-ui,sans-serif">${(hi-f*(hi-lo)).toFixed(0)}</text>`;
  }).join("");
  const pts = hist.map((h,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(h.preco).toFixed(1)}" r="3" fill="#000" stroke="#fff" stroke-width="1.5"/>`).join("");
  const lbl = hist.map((h,i)=>`<text x="${x(i).toFixed(1)}" y="${H-5}" fill="#4a4a4a" font-size="9" text-anchor="middle" font-family="system-ui,sans-serif">${h.data}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${grid}
    <path d="${d}" fill="none" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/>${pts}${lbl}</svg>`;
}

/* --------------------- gráfico de fluxo de caixa ---------------------
   Pilha de saídas por mês + linha branca no nível das entradas.
   O número acima de cada barra é o resultado do mês, com sinal —
   texto e sinal, não só cor, marcam o mês que fecha no vermelho.   */
function barras(pj){
  const W=330,H=184,PL=36,PR=6,PT=24,PB=22;
  const tot = pj.map(p=>p.fixas+p.parc+p.cx+p.var);
  const max = Math.max(...tot, ...pj.map(p=>p.ent))*1.12 || 1;
  const bw = (W-PL-PR)/pj.length;
  const cores = {fixas:"#C084FC", parc:"#60A5FA", cx:"#4ADE80", var:"#3d3d3d"};
  const yv = v => PT + (1-v/max)*(H-PT-PB);
  let out = [0,.5,1].map(f=>{const yy=PT+f*(H-PT-PB);
    return `<line x1="${PL}" y1="${yy}" x2="${W-PR}" y2="${yy}" stroke="#1a1a1a"/>
            <text x="${PL-6}" y="${yy+3.5}" fill="#4a4a4a" font-size="9" text-anchor="end" font-family="system-ui,sans-serif">${((max-f*max)/1000).toFixed(1)}k</text>`;
  }).join("");
  pj.forEach((p,i)=>{
    const cx = PL + i*bw + bw*0.5, w = bw*0.52;
    let acc = 0;
    ["fixas","parc","cx","var"].forEach(k=>{
      const h = (p[k]/max)*(H-PT-PB);
      const yy = PT+(H-PT-PB)-acc-h;
      const r = k==="var" ? 3 : 0;
      out += `<rect x="${(cx-w/2).toFixed(1)}" y="${yy.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(h,0).toFixed(1)}" rx="${r}" fill="${cores[k]}"/>`;
      acc += h;
    });
    const yEnt = yv(p.ent);
    out += `<line x1="${(cx-w/2-4).toFixed(1)}" y1="${yEnt.toFixed(1)}" x2="${(cx+w/2+4).toFixed(1)}" y2="${yEnt.toFixed(1)}" stroke="#fff" stroke-width="1.3" stroke-dasharray="3 2"/>`;
    const r = resultado(p);
    const yTop = Math.max(Math.min(yv(tot[i]), yEnt) - 6, 9);
    out += `<text x="${cx.toFixed(1)}" y="${yTop.toFixed(1)}" fill="${r<0?"var(--up)":"var(--down)"}" font-size="8.5" text-anchor="middle" font-family="system-ui,sans-serif">${r<0?"−":"+"}${Math.abs(Math.round(r))}</text>`;
    out += `<text x="${cx.toFixed(1)}" y="${H-5}" fill="${r<0?"var(--up)":"#4a4a4a"}" font-size="9" text-anchor="middle" font-family="system-ui,sans-serif">${p.mes}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${out}</svg>`;
}

/* ---------------- cartões, limites e parcelas ---------------- */
/* parcela_atual = parcela que cai na fatura deste mês.
   O limite fica preso pelo que ainda falta pagar, incluindo a parcela deste mês. */
const parcRestantes = p => Math.max(0, p.total - p.atual + 1);
const parcSaldo     = p => parcRestantes(p) * p.valor;
const parcNoMes     = (p, i) => (p.atual + i <= p.total) ? p.valor : 0; // i=0 este mês, i=1 próximo...
function gastosCartaoMes(nome){
  return gastosMes().filter(g=>g.cartao===nome).reduce((s,g)=>s+g.valor,0);
}
function resumoCartao(c){
  const parcs  = DB.parcelas.filter(p=>p.cartao===c.nome);
  const fatura = gastosCartaoMes(c.nome);
  const preso  = parcs.reduce((s,p)=>s+parcSaldo(p),0);
  const usado  = fatura + preso;
  const limite = c.limite || 0;
  return { parcs, fatura, preso, usado, limite, livre: limite - usado, pct: limite ? Math.min(100, usado/limite*100) : 0 };
}
function parcelasPorMes(n=6, cartao=""){
  return Array.from({length:n},(_,i)=>({
    mes: MABR[(MES+i)%12],
    valor: DB.parcelas.filter(p=>!cartao||p.cartao===cartao).reduce((s,p)=>s+parcNoMes(p,i),0)
  }));
}
function mesKey(d){ d=new Date(d); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function nomeMesKey(k){ const [a,m]=k.split("-"); return cap(MABR[+m-1])+(+a!==ANO?" "+a:""); }

/* rosca de categorias */
function rosca(itens, total){
  const R=52, C=2*Math.PI*R; let off=0;
  const arcos = itens.map(g=>{
    const f = total ? g.valor/total : 0, len = f*C;
    const s = `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${(CAT[g.cat]||CAT.outros).cor}" stroke-width="14"
      stroke-dasharray="${Math.max(len-1.5,0).toFixed(2)} ${(C-len+1.5).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 70 70)"/>`;
    off += len; return s;
  }).join("");
  return `<svg viewBox="0 0 140 140" style="width:128px;height:128px;flex-shrink:0">
    <circle cx="70" cy="70" r="${R}" fill="none" stroke="#141414" stroke-width="14"/>${arcos}
    <text x="70" y="66" text-anchor="middle" fill="#737373" font-size="9" font-family="system-ui,sans-serif" letter-spacing="1.5">NO MÊS</text>
    <text x="70" y="83" text-anchor="middle" fill="#fff" font-size="14" font-weight="600" font-family="system-ui,sans-serif">${brl(total).replace("R$","").trim()}</text>
  </svg>`;
}

/* ============================== PAINEL ============================== */
function telaInicio(){
  const gm = gastosMes();
  const temDados = DB.entradas.length || DB.fixas.length || DB.gastos.length;

  if(!temDados){
    return `<div class="fade">
      <div class="pad" style="padding-top:18px;padding-bottom:26px">
        <p class="eyebrow" style="margin-bottom:9px">Olá, ${esc(DB.user.nome)}</p>
        <h1 style="margin-bottom:8px">Vamos começar</h1>
        <p class="sub">Cadastre a primeira entrada e as contas fixas. Assim que existir movimento, esta tela vira o painel do seu mês.</p>
      </div>
      <div class="pad" style="display:flex;flex-direction:column;gap:8px">
        <button class="tile" data-tab="plano"><span style="flex:1;font-size:13.5px">Cadastrar entradas e contas fixas</span><svg class="chev" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
        <button class="tile" data-act="manual"><span style="flex:1;font-size:13.5px">Lançar o primeiro gasto</span><svg class="chev" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
        <button class="tile" data-tab="cartao"><span style="flex:1;font-size:13.5px">Cadastrar cartões e limites</span><svg class="chev" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
    </div>`;
  }

  /* fechamento do mês */
  const fixasPagas   = DB.fixas.filter(f=>f.dia<=HOJE);
  const fixasFuturas = DB.fixas.filter(f=>f.dia>HOJE);
  const parcMes  = DB.parcelas.reduce((s,p)=>s+parcNoMes(p,0),0);
  const totVar   = gm.reduce((s,g)=>s+g.valor,0);
  const jaSaiu   = totVar + fixasPagas.reduce((s,f)=>s+f.valor,0);
  const aindaSai = fixasFuturas.reduce((s,f)=>s+f.valor,0) + somaC() + parcMes;
  const fecha    = somaE() - jaSaiu - aindaSai;
  const azul     = fecha >= 0;
  const comprometido = somaE() ? Math.min(100, ((jaSaiu+aindaSai)/somaE())*100) : 0;

  /* mês anterior, para comparar */
  const ant = new Date(ANO, MES-1, 1);
  const varAnt = DB.gastos.filter(g=>{const d=new Date(g.data);return d.getMonth()===ant.getMonth()&&d.getFullYear()===ant.getFullYear();})
                          .reduce((s,g)=>s+g.valor,0);
  /* ritmo: projeta o variável do mês inteiro a partir do que já foi até hoje */
  const diasMes = new Date(ANO, MES+1, 0).getDate();
  const ritmo = HOJE ? totVar/HOJE*diasMes : totVar;

  /* cartões */
  const rc = DB.cartoes.map(c=>({c, r:resumoCartao(c)}));
  const limTotal = rc.reduce((s,x)=>s+x.r.limite,0);
  const livreTotal = rc.reduce((s,x)=>s+(x.r.limite?x.r.livre:0),0);

  const kpi = (l,v,extra="",go="")=>`<button class="kpi" ${go?`data-tab="${go}"`:""}>
    <span class="eyebrow" style="font-size:9.5px">${l}</span>
    <span class="num" style="font-size:17px;font-weight:600;display:block;margin-top:7px">${v}</span>
    ${extra?`<span style="display:block;margin-top:4px;font-size:11px;color:var(--t4)">${extra}</span>`:""}</button>`;

  const cats = porCatMes();
  const legenda = cats.slice(0,6).map(g=>`
    <button class="leg" data-gocat="${g.cat}">${dot((CAT[g.cat]||CAT.outros).cor,7)}
      <span style="flex:1;text-align:left">${(CAT[g.cat]||CAT.outros).nome}</span>
      <span class="num" style="color:var(--t3)">${totVar?Math.round(g.valor/totVar*100):0}%</span></button>`).join("");

  const cartoesMini = rc.filter(x=>x.r.limite).sort((a,b)=>b.r.pct-a.r.pct).slice(0,3).map(({c,r})=>`
    <div style="margin-bottom:13px">
      <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:7px">
        <span style="color:var(--t2)">${esc(c.nome)}</span>
        <span class="num" style="color:${r.livre<0?"var(--up)":"var(--t3)"}">${brl(r.livre)} livre</span></div>
      <span class="barline" style="display:block;height:5px"><span style="width:${r.pct}%;background:${r.pct>85?"var(--up)":r.pct>60?"#FACC15":"#60A5FA"}"></span></span>
    </div>`).join("");

  const lanc = gm.slice(-5).reverse().map(g=>`
    <div>${dot((CAT[g.cat]||CAT.outros).cor,6)}
    <span style="flex:1;min-width:0"><span style="font-size:13.5px;color:var(--t2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(g.desc)}</span>
    <span class="num" style="font-size:11px;color:#4a4a4a;display:block;margin-top:2px">${new Date(g.data).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})}${g.cartao?" · "+esc(g.cartao):""}</span></span>
    <span class="num" style="font-size:13px;color:var(--t3)">${brl(g.valor)}</span></div>`).join("");

  const pj = projecao();
  const outrosGastos = DB.gastos.filter(g=>g.cat==="outros");

  return `<div class="fade">
    <p class="eyebrow pad hello" style="padding-top:14px;margin-bottom:9px">Olá, ${esc((DB.user.nome||"").split(" ")[0])} · ${MESES[MES]}</p>
    <div class="dash-top">
    <div class="pad" style="padding-bottom:22px">
      <div class="card hero">
        <p style="font-size:12px;color:var(--t3)">Como o mês fecha</p>
        <p class="num big" style="margin-top:8px;color:${azul?"#fff":"var(--up)"}">${azul?"+":"−"}${brl(Math.abs(fecha))}</p>
        <p class="num" style="font-size:11.5px;margin-top:8px;color:${azul?"var(--down)":"var(--up)"}">${azul?"no azul":"no vermelho"}<span style="color:var(--t4)"> · ${comprometido.toFixed(0)}% das entradas comprometidas</span></p>
        <span class="barline" style="display:block;height:6px;margin-top:14px"><span style="width:${comprometido}%;background:${comprometido>90?"var(--up)":"#fff"}"></span></span>
      </div>
    </div>

    <div class="pad kpis">
      ${kpi("Entradas", brl(somaE()), DB.entradas.length+" fontes", "plano")}
      ${kpi("Gasto variável", brl(totVar), varAnt?`${delta(varAnt?((totVar-varAnt)/varAnt)*100:0)} vs ${MABR[ant.getMonth()]}`:"", "gastos")}
      ${kpi("Ainda sai", brl(aindaSai), "fixas, caixinhas e parcelas", "plano")}
      ${kpi("Limite livre", limTotal?brl(livreTotal):"—", limTotal?`de ${brl(limTotal)}`:"cadastre os limites", "cartao")}
    </div>
    </div>

    ${outrosGastos.length?`<div class="pad" style="margin:4px 0 26px"><button class="tile" data-act="revisar-outros">
      ${dot("#FACC15",7)}<span style="flex:1"><span style="font-size:13.5px;display:block">${outrosGastos.length} ${outrosGastos.length===1?"gasto":"gastos"} em "Outros"</span>
      <span style="font-size:11.5px;color:var(--t4);display:block;margin-top:3px">Toque para organizar por categoria</span></span>
      <svg class="chev" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button></div>`:`<div style="height:22px"></div>`}

    <div class="dash-grid">
    ${cats.length?sec("Para onde foi o dinheiro", `ritmo: ${brl(ritmo)} no mês`, `<div class="pad"><div class="card" style="display:flex;gap:16px;align-items:center">
      ${rosca(cats,totVar)}<div style="flex:1;min-width:0">${legenda}</div></div>
      <button class="link" data-tab="gastos">Ver o histórico de compras →</button></div>`):""}

    ${DB.cartoes.length?sec("Cartões", limTotal?brl(livreTotal)+" livre":"", `<div class="pad"><div class="card">
      ${cartoesMini || `<p style="font-size:12px;color:var(--t4);line-height:1.6">Informe o limite de cada cartão para ver quanto ainda dá para usar.</p>`}
      ${DB.parcelas.length?`<div style="padding-top:12px;margin-top:4px;border-top:1px solid var(--line)">
        <p style="font-size:11px;color:var(--t4);margin-bottom:10px">Faturas previstas (parcelas programadas)</p>${miniBarras(parcelasPorMes(6))}</div>`:""}
    </div><button class="link" data-tab="cartao">Previsão de faturas e limites →</button></div>`):""}

    ${pj?sec("Próximos 6 meses","resultado por mês",`<div class="pad"><div class="card">${barras(pj)}</div>
      <p style="font-size:11px;color:#4a4a4a;line-height:1.6;margin-top:10px">Entradas e fixas se repetem, as parcelas seguem o calendário de cada compra e o variável usa a sua média mensal.</p></div>`):""}

    ${lanc?sec("Últimos lançamentos", gm.length+" no mês", `<div class="pad"><div class="rows">${lanc}</div>

/* ============================== GASTOS (com filtros) ============================== */
function gastosFiltrados(){
  const f = S.fg;
  return DB.gastos.map((g,i)=>({...g,_i:i})).filter(g=>
    (!f.mes || mesKey(g.data)===f.mes) &&
    (!f.cats.length || f.cats.includes(g.cat)) &&
    (!f.cartoes.length || f.cartoes.includes(g.cartao||"__sem"))
  ).sort((a,b)=>new Date(b.data)-new Date(a.data));
}
function telaGastos(){
  const f = S.fg;
  const meses = [...new Set(DB.gastos.map(g=>mesKey(g.data)))].sort().reverse();
  const lista = gastosFiltrados();
  const total = lista.reduce((s,g)=>s+g.valor,0);

  const chip = (on,label,attr,cor)=>`<button class="chip" ${attr} style="${on?`border-color:${cor||"#fff"};color:${cor||"#fff"};background:${(cor||"#ffffff")}18`:""}">${label}</button>`;
  const chipsMes = chip(!f.mes,"Todos",`data-fg="mes|"`) + meses.map(k=>chip(f.mes===k,nomeMesKey(k),`data-fg="mes|${k}"`)).join("");
  const chipsCat = chip(!f.cats.length,"Todas",`data-fg="cat|"`) + Object.entries(CAT).map(([k,c])=>chip(f.cats.includes(k),c.nome,`data-fg="cat|${k}"`,c.cor)).join("");
  const nomesCartao = [...DB.cartoes.map(c=>c.nome)];
  const chipsCartao = chip(!f.cartoes.length,"Todos",`data-fg="cartao|"`) + nomesCartao.map(n=>chip(f.cartoes.includes(n),esc(n),`data-fg="cartao|${esc(n)}"`)).join("")
    + chip(f.cartoes.includes("__sem"),"Sem cartão",`data-fg="cartao|__sem"`);

  /* resumo por categoria dentro do filtro */
  const porCat = {}; lista.forEach(g=>{porCat[g.cat]=(porCat[g.cat]||0)+g.valor;});
  const top = Object.entries(porCat).sort((a,b)=>b[1]-a[1]);
  const barra = total ? `<div class="track" style="margin-top:14px">${top.map(([k,v])=>`<span style="width:${v/total*100}%;background:${(CAT[k]||CAT.outros).cor}"></span>`).join("")}</div>` : "";

  /* lista agrupada por dia */
  let ultimoDia = "", linhas = "";
  lista.forEach(g=>{
    const dia = new Date(g.data).toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"short"});
    if(dia!==ultimoDia){ linhas += `<p class="diahead">${dia}</p>`; ultimoDia = dia; }
    linhas += `<div class="gitem">${dot((CAT[g.cat]||CAT.outros).cor,7)}
      <span style="flex:1;min-width:0"><span style="font-size:13.5px;color:#e5e5e5;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(g.desc)}</span>
      <span style="font-size:11px;color:#4a4a4a;display:block;margin-top:3px"><span class="pill">${g.cartao?esc(g.cartao):g.semNota?"dinheiro / PIX":"sem cartão"}</span>${(CAT[g.cat]||CAT.outros).nome}${g.obs?" · "+esc(g.obs):""}</span></span>
      <span class="num" style="font-size:13.5px;color:var(--t2)">${brl(g.valor)}</span>
      <button class="xis" data-del="gasto|${g._i}" aria-label="apagar">×</button></div>`;
  });

  const ativos = (f.mes?1:0) + f.cats.length + f.cartoes.length;
  const porCartao = {}; lista.forEach(g=>{ const k=g.cartao||"Sem cartão"; porCartao[k]=(porCartao[k]||0)+g.valor; });
  const resumoCartoes = Object.entries(porCartao).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`
    <div><span style="font-size:13px;color:var(--t2);flex:1">${esc(k)}</span><span class="num" style="font-size:13px;color:var(--t3)">${brl(v)}</span></div>`).join("");

  return `<div class="fade">
    <div class="pad" style="padding-top:14px;padding-bottom:18px">
      <h1>Compras</h1>
      <p class="sub">O registro do que você comprou e em qual cartão. Filtre por mês, categoria e cartão.</p>
    </div>
    <div class="pad">
      <p class="flabel">Mês</p><div class="chiprow">${chipsMes}</div>
      <p class="flabel">Categoria</p><div class="chiprow">${chipsCat}</div>
      <p class="flabel">Cartão</p><div class="chiprow">${chipsCartao}</div>
      ${ativos?`<button class="link" data-fg="limpar|" style="margin-top:4px">Limpar filtros (${ativos})</button>`:""}
    </div>
    <div class="pad" style="margin:18px 0 24px">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <span style="font-size:12px;color:var(--t3)">${lista.length} ${lista.length===1?"lançamento":"lançamentos"}</span>
          <span class="num mid" style="font-size:26px">${brl(total)}</span></div>
        ${barra}
        ${top.length>1?`<div style="display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px">${top.slice(0,5).map(([k,v])=>`<span style="display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--t3)">${dot((CAT[k]||CAT.outros).cor,6)}${(CAT[k]||CAT.outros).nome} <span class="num">${brl(v)}</span></span>`).join("")}</div>`:""}
      </div>
    </div>
    ${blocoRegistro()}
    ${resumoCartoes?sec("Em qual cartão", lista.length+" compras", `<div class="pad"><div class="rows">${resumoCartoes}</div></div>`):""}
    ${sec("Histórico","mais recentes primeiro",`<div class="pad">${linhas || `<div class="card"><p style="font-size:12px;color:var(--t4)">Nenhuma compra com esses filtros.</p></div>`}
      <small class="hint" style="margin-top:14px">Compras parceladas ficam em Faturas e limites, para não contar duas vezes.</small></div>`)}
  </div>`;
}

/* ============================== FATURAS E LIMITES ==============================
   Só previsão. Mês 0 = fatura atual (compras à vista do mês no cartão + parcelas do mês).
   Meses seguintes = parcelas já programadas. O limite livre de cada mês considera
   que as faturas anteriores foram pagas e liberaram o limite.                     */
function previsaoCartao(c, i){
  const parcs = DB.parcelas.filter(p=>p.cartao===c.nome);
  const avista = i===0 ? gastosCartaoMes(c.nome) : 0;
  const parcMes = parcs.reduce((s,p)=>s+parcNoMes(p,i),0);
  const preso = parcs.reduce((s,p)=>s + Math.max(0, p.total - (p.atual + i) + 1) * p.valor, 0);
  const limite = c.limite || 0;
  return { avista, parcMes, fatura: avista + parcMes, preso, livre: limite - avista - preso, limite };
}
function telaCartao(){
  const N = 6, mi = Math.min(S.fmes||0, N-1);
  const mesNome = i => cap(MESES[(MES+i)%12]) + ((MES+i)>=12 ? " "+(ANO+1) : "");
  const porMes = Array.from({length:N},(_,i)=>{
    const lin = DB.cartoes.map(c=>({c, ...previsaoCartao(c,i)}));
    return { i, fatura: lin.reduce((s,x)=>s+x.fatura,0), livre: lin.filter(x=>x.limite).reduce((s,x)=>s+x.livre,0), lin };
  });
  const limTotal = DB.cartoes.reduce((s,c)=>s+(c.limite||0),0);
  const sel = porMes[mi];

  const chipsMes = porMes.map(m=>`<button class="mcard ${m.i===mi?"on":""}" data-fmes="${m.i}">
      <span style="font-size:11px;color:${m.i===mi?"#fff":"var(--t4)"}">${m.i===0?"Atual":cap(MABR[(MES+m.i)%12])}</span>
      <span class="num" style="font-size:13px;font-weight:600;margin-top:5px;display:block">${brl(m.fatura).replace(",00","")}</span>
    </button>`).join("");

  const linhasCartao = sel.lin.map(({c,fatura,avista,parcMes,livre,limite})=>{
    const pct = limite ? Math.min(100, (limite-livre)/limite*100) : 0;
    const cor = pct>85?"var(--up)":pct>60?"#FACC15":"#60A5FA";
    return `<div class="card" style="margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span style="font-size:14px">${esc(c.nome)}</span>
        <span class="num" style="font-size:15px;font-weight:600">${brl(fatura)}</span></div>
      <p class="num" style="font-size:11px;color:var(--t4);margin-top:4px;text-align:right">${mi===0&&avista?`${brl(avista)} à vista + `:""}${brl(parcMes)} em parcelas</p>
      ${limite?`<span class="barline" style="display:block;height:5px;margin-top:12px"><span style="width:${pct}%;background:${cor}"></span></span>
        <p class="num" style="font-size:11.5px;margin-top:8px;color:${livre<0?"var(--up)":"var(--t3)"}">${brl(livre)} de limite livre <span style="color:var(--t4)">de ${brl(limite)}</span></p>`
      :`<p style="font-size:11.5px;color:var(--t4);margin-top:10px">Sem limite cadastrado</p>`}
    </div>`;
  }).join("");

  /* gestão: limites e parcelamentos */
  const listaCartoes = DB.cartoes.map((c,i)=>{
    const ed = S.form==="limite-"+i;
    return `<div style="flex-wrap:wrap"><span style="font-size:13.5px;color:var(--t2);flex:1">${esc(c.nome)}</span>
      <span class="num" style="font-size:12.5px;color:var(--t3)">${c.limite?brl(c.limite):"sem limite"}</span>
      <button class="chip" data-form="limite-${i}">${c.limite?"editar":"+ limite"}</button>
      <button class="xis" data-del="cartao|${i}" aria-label="remover ${esc(c.nome)}">×</button>
      ${ed?`<div style="width:100%;margin-top:10px">${campoValor("f-lim-"+i,"Limite total do cartão")}
        ${S.tmp.erro?`<p class="err">${S.tmp.erro}</p>`:""}
        <button class="primary" data-act="save-limite" data-idx="${i}" style="margin-top:2px">Salvar limite</button></div>`:""}

    const on = i===S.prod;

      </span></button>`;

  const hist = p.hist.map((h,i)=>{

    return `<div style="display:flex;align-items:center;gap:11px;margin-bottom:9px">

function normalizar(txt){
  return (txt||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}
function sugerirCategoria(desc){
  const d = normalizar(desc);
  for(const [cat, palavras] of Object.entries(PALAVRAS_CAT)){
    if(!CAT[cat]) continue;
    if(palavras.some(p => d.includes(normalizar(p)))) return cat;
  }
  return null;
}

/* ------------------------- leitor de QR (câmera) ------------------------- */
let scannerStream = null, scannerRAF = null;

async function iniciarScanner(){
  const video = document.getElementById("cam-video");
  const canvas = document.getElementById("cam-canvas");
  if(!video || !canvas) return;
  try{
    scannerStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
  }catch(err){
    S.nota = "inicio";
    S.tmp.erro = "Não consegui acessar a câmera. Verifique se o navegador tem permissão.";
    return render();
  }
  video.srcObject = scannerStream;
  try{ await video.play(); }catch(err){}
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  const tick = () => {
    if(S.nota !== "camera"){ pararScanner(); return; }
    if(video.readyState === video.HAVE_ENOUGH_DATA){
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = window.jsQR(img.data, img.width, img.height);
      if(code && code.data){
        pararScanner();
        processarQr(code.data);
        return;
      }
    }
    scannerRAF = requestAnimationFrame(tick);
  };
  scannerRAF = requestAnimationFrame(tick);
}

function pararScanner(){
  if(scannerRAF) cancelAnimationFrame(scannerRAF);
  if(scannerStream) scannerStream.getTracks().forEach(t=>t.stop());
  scannerStream = null; scannerRAF = null;
}

async function processarQr(texto){
  S.nota = "processando"; render();
  try{
    const { data, error } = await sb.functions.invoke("ler-nota", { body: { qrUrl: texto } });
    if(error || !data || data.error){
      S.nota = "erro-leitura";
      S.tmp.erro = (data && data.error) || "Não consegui ler essa nota. Tente de novo ou lance manualmente.";
      return render();
    }
    S.notaLida = { mercado: data.mercado || "Nota fiscal", cnpj: data.cnpj || "", data: data.data || "" };
    S.itens = (data.itens||[]).map(it => ({ desc: it.desc, qtd: 1, un: it.valor, cat: sugerirCategoria(it.desc) || "outros" }));
    if(!S.itens.length){
      S.nota = "erro-leitura";
      S.tmp.erro = "A nota foi lida, mas não consegui separar os itens automaticamente dessa vez. Lance manualmente por enquanto.";
      return render();
    }
    S.nota = "revisao";
  }catch(err){
    S.nota = "erro-leitura";
    S.tmp.erro = "Não consegui ler essa nota agora. Tente de novo em instantes.";
  }
  render();
}

/* ------------------------- leitor de fatura (PDF) ------------------------- */
if(window.pdfjsLib){
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
}

async function extrairLinhasPDF(file){
  const buf = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
  const linhas = [];
  for(let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    let linhaAtual = "", ultimoY = null;
    for(const item of content.items){
      const y = item.transform[5];
      if(ultimoY !== null && Math.abs(y-ultimoY) > 2){
        if(linhaAtual.trim()) linhas.push(linhaAtual.trim());
        linhaAtual = "";
      }
      linhaAtual += item.str + " ";
      ultimoY = y;
    }
    if(linhaAtual.trim()) linhas.push(linhaAtual.trim());
  }
  return linhas;
}

function extrairTransacoesFatura(linhas){
  const transacoes = [];
  const re = /^(\d{2}\s?\/\s?\d{2}(?:\s?\/\s?\d{2,4})?)\s+(.{3,60}?)\s+(-?\s?R?\$?\s?\d{1,3}(?:\.\d{3})*,\d{2})\s*$/;
  const ignorar = /pagamento recebido|estorno|saldo anterior|total desta fatura|limite dispon/i;
  for(const l of linhas){
    const m = l.match(re);
    if(!m) continue;
    if(ignorar.test(m[2])) continue;
    const valorTxt = m[3].replace(/\s/g,"");
    if(valorTxt.startsWith("-")) continue; // crédito/pagamento, não é gasto
    const valor = parseFloat(valorTxt.replace(/R\$/,"").replace(/\./g,"").replace(",", "."));
    if(valor > 0 && valor < 100000){
      transacoes.push({ desc: m[2].trim(), valor, data: m[1].replace(/\s/g,"") });
    }
  }
  return transacoes;
}

async function processarFatura(file, cartaoNome){
  S.faturaCartao = cartaoNome || "";
  S.nota = "processando"; S.tab = "nota"; render();
  try{
    const linhas = await extrairLinhasPDF(file);
    const transacoes = extrairTransacoesFatura(linhas);
    if(!transacoes.length){
      S.nota = "erro-leitura";
      S.tmp.erro = "Consegui abrir o PDF, mas não reconheci o formato das transações dessa fatura. Lance manualmente por enquanto.";
      return render();
    }
    S.notaLida = { mercado: `Fatura${cartaoNome?" · "+cartaoNome:""}`, cnpj:"", data:"" };
    S.itens = transacoes.map(t => ({ desc:t.desc, qtd:1, un:t.valor, cat:sugerirCategoria(t.desc) || "outros", data:t.data }));
    S.nota = "revisao";
  }catch(err){
    S.nota = "erro-leitura";
    S.tmp.erro = "Não consegui ler esse PDF agora.";
  }
  render();
}

function erroAmigavel(e){
  const m = (e && e.message) || "";
  if(m.includes("already registered") || m.includes("already exists")) return "Esse e-mail já tem uma conta. Toque em Entrar.";
  if(m.includes("Invalid login credentials")) return "E-mail ou senha incorretos.";
  if(m.includes("Password should be at least")) return "A senha precisa de pelo menos 6 caracteres.";
  if(m.includes("Unable to validate email") || m.includes("invalid")) return "Digite um e-mail válido.";
  return "Não deu para completar agora. Tente de novo em instantes.";
}

document.addEventListener("click", async e=>{
  const b = e.target.closest("[data-tab],[data-go],[data-scan],[data-prod],[data-cat],[data-act],[data-form],[data-banco],[data-selcat],[data-cor],[data-del],[data-recat],[data-fg],[data-gocat],[data-fmes]");
  if(!b) return;
  snap();

  /* navegação */
  if(b.dataset.act==="menu-abrir"){ S.menu=true; S.manterScroll=true; return render(); }
  if(b.dataset.act==="menu-fechar"){ S.menu=false; S.manterScroll=true; return render(); }
  if(b.dataset.gocat){ S.fg={mes:mesKey(new Date()), cats:[b.dataset.gocat], cartoes:[]}; S.tab="gastos"; S.revisando=false; S.menu=false; S.form=null; return render(); }
  if(b.dataset.fmes!==undefined){ S.fmes=+b.dataset.fmes; S.manterScroll=true; return render(); }
  if(b.dataset.fg!==undefined){
    const [campo,val] = b.dataset.fg.split("|");
    if(campo==="limpar") S.fg={mes:"",cats:[],cartoes:[]};
    if(campo==="mes") S.fg.mes = val;
    if(campo==="cat"||campo==="cartao"){
      const lista = campo==="cat" ? "cats" : "cartoes";
      if(!val) S.fg[lista]=[];
      else S.fg[lista] = S.fg[lista].includes(val) ? S.fg[lista].filter(x=>x!==val) : [...S.fg[lista], val];
    }
    S.manterScroll=true; return render();
  }
  S.menu = false;
  if(b.dataset.tab){ S.tab = b.dataset.tab; S.revisando=false; if(S.tab!=="nota") S.nota="inicio"; S.form=null; S.tmp.erro=""; return render(); }
  if(b.dataset.go){ S.tab = b.dataset.go; if(b.dataset.prod!==undefined) S.prod = +b.dataset.prod; S.form=null; return render(); }
  if(b.dataset.prod){ S.prod = +b.dataset.prod; return render(); }
  if(b.dataset.form){ S.form = S.form===b.dataset.form ? null : b.dataset.form; S.tmp.erro=""; return render(); }
  if(b.dataset.banco){ S.tmp.banco = b.dataset.banco; return render(); }
  if(b.dataset.cor){ S.tmp.cor = b.dataset.cor; return render(); }
  if(b.dataset.selcat){ const [ch,k]=b.dataset.selcat.split("|"); S.tmp[ch]=k; return render(); }

  /* chips de categoria dos itens da nota (demonstração) */
  if(b.dataset.cat){
    const [i,k] = b.dataset.cat.split("|");
    S.itens[+i].cat = k;
    return render();
  }
  /* fluxo de escanear nota fiscal (câmera + leitura real) */
  if(b.dataset.scan === "1"){
    S.nota = "camera"; S.tmp.erro=""; render();
    iniciarScanner();
    return;
  }
  if(b.dataset.scan === "cancel"){
    pararScanner();
    S.nota = "inicio";
    return render();
  }

  /* recategorizar um gasto que estava em "Outros" */
  if(b.dataset.recat){
    const [i,k] = b.dataset.recat.split("|");
    const item = DB.gastos[+i];
    if(item){
      try{ await atualizar("expenses", item.id, { cat:k }); item.cat = k; }
      catch(err){ /* falha silenciosa — tenta de novo depois */ }
    }
    return render();
  }

  /* remoções */
  if(b.dataset.del){
    const [tipo,ref] = b.dataset.del.split("|");
    try{
      if(tipo==="cartao"){   const it=DB.cartoes[+ref];   await remover("cards", it.id);           DB.cartoes.splice(+ref,1); }
      if(tipo==="entrada"){  const it=DB.entradas[+ref];  await remover("incomes", it.id);         DB.entradas.splice(+ref,1); }
      if(tipo==="fixa"){     const it=DB.fixas[+ref];     await remover("fixed_expenses", it.id);  DB.fixas.splice(+ref,1); }
      if(tipo==="caixinha"){ const it=DB.caixinhas[+ref]; await remover("savings", it.id);         DB.caixinhas.splice(+ref,1); }
      if(tipo==="gasto"){    const it=DB.gastos[+ref];    await remover("expenses", it.id);        DB.gastos.splice(+ref,1); S.manterScroll=true; }
      if(tipo==="parcela"){  const it=DB.parcelas[+ref];  await remover("installments", it.id);    DB.parcelas.splice(+ref,1); }
      if(tipo==="notaitem"){ S.itens.splice(+ref,1); return render(); }
      if(tipo==="cat" && ref!=="outros"){
        const catId = DB.cats[ref] && DB.cats[ref].id;
        if(catId) await remover("categories", catId);
        await Promise.all([
          sb.from("expenses").update({cat:"outros"}).eq("user_id",UID).eq("cat",ref),
          sb.from("fixed_expenses").update({cat:"outros"}).eq("user_id",UID).eq("cat",ref),
        ]);
        delete DB.cats[ref];
        DB.gastos.forEach(g=>{ if(g.cat===ref) g.cat="outros"; });
        DB.fixas.forEach(f=>{ if(f.cat===ref) f.cat="outros"; });
      }
    }catch(err){ /* mantém como estava localmente se a exclusão falhar */ }
    return render();
  }

  const act = b.dataset.act;
  if(!act) return;

  /* conta e sessão */
  if(act==="ir-criar"){ S.tmp.erro=""; S.view="criar"; return render(); }
  if(act==="ir-login"){ S.tmp.erro=""; S.tmp.msg=""; S.view="login"; return render(); }

  if(act==="criar"){
    const u=V("f-user"), email=V("f-email"), p=S.tmp.vals["f-pass"]||"", p2=S.tmp.vals["f-pass2"]||"";
    if(!u){ S.tmp.erro="Escolha como você quer ser chamado."; return render(); }
    if(!email.includes("@")){ S.tmp.erro="Digite um e-mail válido."; return render(); }
    if(p.length<6){ S.tmp.erro="A senha precisa de pelo menos 6 caracteres."; return render(); }
    if(p!==p2){ S.tmp.erro="As senhas não coincidem — digite a mesma nas duas."; return render(); }
    const { data, error } = await sb.auth.signUp({ email, password:p, options:{ data:{ nome:u } } });
    if(error){ S.tmp.erro=erroAmigavel(error); return render(); }
    limpar("f-user","f-email","f-pass","f-pass2");
    if(data.session){
      UID = data.user.id;
      await carregarDoServidor(UID);
      S.view = DB.onboarded ? "app" : "onb1"; S.tab="inicio";
    } else {
      S.tmp.emailPendente = email; S.view="confirme";
    }
    return render();
  }

  if(act==="ja-confirmei"){
    const { data:{ session } } = await sb.auth.getSession();
    if(session){
      UID = session.user.id;
      await carregarDoServidor(UID);
      S.view = DB.onboarded ? "app" : "onb1"; S.tab="inicio"; S.tmp.erro="";
    } else {
      S.tmp.erro = "Ainda não encontramos a confirmação. Toque no link do e-mail e volte aqui.";
    }
    return render();
  }

  if(act==="entrar"){
    const email=V("f-login-email"), p=S.tmp.vals["f-login-pass"]||"";
    if(!email || !p){ S.tmp.erro="Preencha e-mail e senha."; return render(); }
    const { data, error } = await sb.auth.signInWithPassword({ email, password:p });
    if(error){ S.tmp.erro=erroAmigavel(error); return render(); }
    UID = data.user.id;
    await carregarDoServidor(UID);
    limpar("f-login-email","f-login-pass"); S.tmp.msg="";
    S.view = DB.onboarded ? "app" : "onb1"; S.tab="inicio";
    return render();
  }

  if(act==="esqueci"){
    const email=V("f-login-email");
    if(!email){ S.tmp.erro="Digite seu e-mail acima para receber o link de redefinição."; return render(); }
    const redirectTo = window.location.href.split("#")[0].split("?")[0];
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo });
    S.tmp.erro = "";
    S.tmp.msg = error ? "Não deu para enviar agora. Tente de novo em instantes." : `Enviamos um link de redefinição para ${email}.`;
    return render();
  }

  if(act==="sair"){
    try{ await sb.auth.signOut(); }catch(err){}
    DB=novoDB(); CAT=DB.cats; UID=null;
    S.tmp={vals:{},erro:"",banco:"",cor:PALETA[6],gcat:"mercado",ccat:"mercado",volta:false};
    S.confirmaReset=false; S.view="boas"; return render();
  }

  if(act==="ajustes"){ S.tmp.volta=true; S.tmp.banco=DB.banco; S.view="onb1"; return render(); }

  if(act==="revisar-outros"){ S.revisando=true; return render(); }
  if(act==="fechar-revisar"){ S.revisando=false; return render(); }

  if(act==="pick-fatura"){
    const inp = document.getElementById("fatura-input");
    if(inp){ inp.dataset.cartao = b.dataset.cartaoNome || ""; inp.click(); }
    return;
  }

  /* onboarding */
  if(act==="addcartao" || act==="save-cartao"){
    const id = act==="addcartao" ? "f-cartao" : "f-cc-nome";
    const n=V(id);
    if(!n){ S.tmp.erro="Digite o nome do cartão antes de adicionar."; return render(); }
    try{
      const lim = act==="save-cartao" ? num(V("f-cc-lim")) : 0;
      const row = await inserir("cards", lim>0 ? { nome:n, limite:lim } : { nome:n });
      DB.cartoes.push({ id:row.id, nome:row.nome, limite:row.limite==null?0:+row.limite });
      limpar(id,"f-cc-lim"); if(act==="save-cartao") S.form=null;
    }catch(err){ S.tmp.erro="Não deu para salvar o cartão agora."; }
    return render();
  }
  if(act==="save-limite"){
    const i=+b.dataset.idx, c=DB.cartoes[i], v=num(V("f-lim-"+i));
    if(!c) return render();
    if(v<=0){ S.tmp.erro="Informe o limite total do cartão."; return render(); }
    try{ await atualizar("cards", c.id, { limite:v }); c.limite=v; limpar("f-lim-"+i); S.form=null; }
    catch(err){ S.tmp.erro="Não deu para salvar o limite agora."; }
    S.manterScroll=true; return render();
  }
  if(act==="save-parcela"){
    const d=V("f-pa-desc"), v=num(V("f-pa-valor")), at=parseInt(V("f-pa-atual"))||1, tot=parseInt(V("f-pa-total"))||0, cartao=S.tmp.vals["f-pa-cartao"]||"";
    if(!d){ S.tmp.erro="Diga o que foi comprado."; return render(); }
    if(v<=0){ S.tmp.erro="Informe o valor de cada parcela."; return render(); }
    if(tot<1 || at<1 || at>tot){ S.tmp.erro="Confira as parcelas: a parcela deste mês não pode passar do total."; return render(); }
    if(!cartao){ S.tmp.erro="Escolha em qual cartão está o parcelamento."; return render(); }
    try{
      const row = await inserir("installments", { descricao:d, valor:v, cartao, parcela_atual:at, parcela_total:tot });
      DB.parcelas.push({ id:row.id, desc:row.descricao, valor:+row.valor, cartao:row.cartao, atual:row.parcela_atual, total:row.parcela_total });
      limpar("f-pa-desc","f-pa-valor","f-pa-atual","f-pa-total","f-pa-cartao"); S.form=null;
    }catch(err){ S.tmp.erro="Não deu para salvar o parcelamento agora."; }
    return render();
  }
  if(act==="onb1ok"){
    const banco = S.tmp.banco || DB.banco;
    try{ await atualizar("profiles", UID, { banco }); DB.banco = banco; }catch(err){}
    S.tmp.erro=""; S.view="onb2"; return render();
  }
  if(act==="addcat"){
    const n=V("f-cat");
    if(!n){ S.tmp.erro="Digite o nome da categoria antes de adicionar."; return render(); }
    const k=n.toLowerCase().normalize("NFD").replace(/[^\w]/g,"").slice(0,20)||("cat"+Date.now());
    if(DB.cats[k]){ S.tmp.erro="Já existe uma categoria com esse nome."; return render(); }
    try{
      const row = await inserir("categories", { chave:k, nome:cap(n), cor:S.tmp.cor });
      DB.cats[k] = { id:row.id, nome:row.nome, cor:row.cor }; CAT = DB.cats;
      limpar("f-cat");
    }catch(err){ S.tmp.erro="Já existe uma categoria com esse nome ou não deu para salvar agora."; }
    return render();
  }
  if(act==="onb2ok"){
    S.tmp.erro="";
    if(S.tmp.volta){ S.tmp.volta=false; S.view="app"; } else S.view="onb3";
    return render();
  }
  if(act==="fim"){
    try{ await atualizar("profiles", UID, { onboarded:true }); }catch(err){}
    DB.onboarded=true; S.view="app"; S.tab="inicio"; return render();
  }

  if(act==="apagardados1"){ S.confirmaReset=true;  return render(); }
  if(act==="apagardados0"){ S.confirmaReset=false; return render(); }
  if(act==="apagardados2"){
    try{
      await Promise.all([
        sb.from("incomes").delete().eq("user_id",UID),
        sb.from("fixed_expenses").delete().eq("user_id",UID),
        sb.from("savings").delete().eq("user_id",UID),
        sb.from("expenses").delete().eq("user_id",UID),
        sb.from("installments").delete().eq("user_id",UID),
      ]);
      await sb.from("cards").delete().eq("user_id",UID);
      await carregarDoServidor(UID);
    }catch(err){}
    S.confirmaReset=false; S.view="app"; S.tab="inicio"; return render();
  }

  /* lançamentos */
  if(act==="manual"){ S.tab="nota"; S.nota="manual"; S.tmp.erro=""; return render(); }
  if(act==="cancel-manual"){ S.nota="inicio"; limpar("f-g-desc","f-g-valor","f-g-obs"); return render(); }

  if(act==="save-entrada"){
    const d=V("f-en-desc"), v=num(V("f-en-valor")), dia=Math.min(31,Math.max(1,parseInt(V("f-en-dia"))||1));
    if(!d){ S.tmp.erro="Dê um nome à entrada."; return render(); }
    if(v<=0){ S.tmp.erro="Informe um valor maior que zero."; return render(); }
    try{
      const row = await inserir("incomes", { descricao:d, valor:v, dia });
      DB.entradas.push({ id:row.id, desc:row.descricao, valor:+row.valor, dia:row.dia });
      limpar("f-en-desc","f-en-valor","f-en-dia"); S.form=null;
    }catch(err){ S.tmp.erro="Não deu para salvar a entrada agora."; }
    return render();
  }
  if(act==="save-fixa"){
    const d=V("f-fx-desc"), v=num(V("f-fx-valor")), dia=Math.min(31,Math.max(1,parseInt(V("f-fx-dia"))||1));
    const cat=S.tmp.vals["f-fx-cat"]||"casa";
    if(!d){ S.tmp.erro="Dê um nome à conta fixa."; return render(); }
    if(v<=0){ S.tmp.erro="Informe um valor maior que zero."; return render(); }
    try{
      const row = await inserir("fixed_expenses", { descricao:d, valor:v, dia, cat });
      DB.fixas.push({ id:row.id, desc:row.descricao, valor:+row.valor, dia:row.dia, cat:row.cat });
      limpar("f-fx-desc","f-fx-valor","f-fx-dia"); S.form=null;
    }catch(err){ S.tmp.erro="Não deu para salvar a conta fixa agora."; }
    return render();
  }
  if(act==="save-caixinha"){
    const d=V("f-cx-desc"), v=num(V("f-cx-valor")), dia=Math.min(31,Math.max(1,parseInt(V("f-cx-dia"))||1));
    if(!d){ S.tmp.erro="Dê um nome à caixinha."; return render(); }
    if(v<=0){ S.tmp.erro="Informe um aporte maior que zero."; return render(); }
    try{
      const row = await inserir("savings", { descricao:d, aporte:v, dia });
      DB.caixinhas.push({ id:row.id, desc:row.descricao, aporte:+row.aporte, dia:row.dia });
      limpar("f-cx-desc","f-cx-valor","f-cx-dia"); S.form=null;
    }catch(err){ S.tmp.erro="Não deu para salvar a caixinha agora."; }
    return render();
  }
  if(act==="save-gasto" || act==="save-semnota"){
    const pfx = act==="save-gasto" ? "g" : "c";
    const d=V(`f-${pfx}-desc`), v=num(V(`f-${pfx}-valor`)), obs=V(`f-${pfx}-obs`);
    const cartao=S.tmp.vals[`f-${pfx}-cartao`]||"";
    const cat=S.tmp[pfx==="g"?"gcat":"ccat"]||"outros";
    if(!d){ S.tmp.erro="Diga onde foi ou o que foi o gasto."; return render(); }
    if(v<=0){ S.tmp.erro="Informe um valor maior que zero."; return render(); }
    try{
      const row = await inserir("expenses", { descricao:d, valor:v, cat, obs, cartao, data:new Date().toISOString(), sem_nota:pfx==="c" });
      DB.gastos.push({ id:row.id, desc:row.descricao, valor:+row.valor, cat:row.cat, obs:row.obs||"", cartao:row.cartao||"", data:row.data, semNota:row.sem_nota });
      limpar(`f-${pfx}-desc`,`f-${pfx}-valor`,`f-${pfx}-obs`);
      if(pfx==="g"){ S.nota="inicio"; S.tab="inicio"; } else { S.form=null; S.manterScroll=true; }
    }catch(err){ S.tmp.erro="Não deu para salvar o gasto agora."; }
    return render();
  }

  if(act==="save-nota-itens"){
    if(!S.itens || !S.itens.length){ S.nota="inicio"; return render(); }
    try{
      const dataIso = new Date().toISOString();
      const ehFatura = !!S.faturaCartao;
      const obsBase = S.notaLida?.mercado ? (ehFatura ? S.notaLida.mercado : `Nota: ${S.notaLida.mercado}`) : "";
      for(const it of S.itens){
        const obs = ehFatura && it.data ? `${obsBase} · ${it.data}` : obsBase;
        const row = await inserir("expenses", { descricao:it.desc, valor:it.qtd*it.un, cat:it.cat, obs, cartao:S.faturaCartao||"", data:dataIso, sem_nota:false });
        DB.gastos.push({ id:row.id, desc:row.descricao, valor:+row.valor, cat:row.cat, obs:row.obs||"", cartao:row.cartao||"", data:row.data, semNota:false });
      }
      S.itens=[]; S.notaLida=null;
      S.tab = ehFatura ? "gastos" : "inicio"; S.faturaCartao=""; S.nota="inicio";
    }catch(err){ S.tmp.erro="Salvei parte dos itens, mas algo falhou no meio do caminho. Confira seus lançamentos antes de repetir."; }
    return render();
  }
});

/* ------------------------------ versão ------------------------------
   O atalho na tela de início do iPhone costuma segurar a versão antiga.
   Ao abrir (e ao voltar para o app), busca o index.html sem cache e,
   se a versão publicada for outra, recarrega uma única vez.            */
const VERSAO = "2026-10-23.3";
async function conferirVersao(){
  try{
    const r = await fetch(location.pathname + "?v=" + Date.now(), { cache:"no-store" });
    const html = await r.text();
    const m = html.match(/const VERSAO = "([^"]+)"/);
    if(m && m[1] !== VERSAO && sessionStorage.getItem("bp-recarregou") !== m[1]){
      sessionStorage.setItem("bp-recarregou", m[1]);
      location.replace(location.pathname + "?v=" + m[1]);
    }
  }catch(err){}
}
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") conferirVersao(); });

/* ------------------------------ boot ------------------------------ */
async function boot(){
  conferirVersao();
  S.view = "boot"; render();
  const { data:{ session } } = await sb.auth.getSession();
  if(session){
    UID = session.user.id;
    try{ await carregarDoServidor(UID); S.view = DB.onboarded ? "app" : "onb1"; S.tab="inicio"; }
    catch(err){ S.view = "boas"; }
  } else {
    S.view = "boas";
  }
  render();
}
sb.auth.onAuthStateChange((event)=>{
  if(event==="SIGNED_OUT" && S.view!=="boas"){ DB=novoDB(); CAT=DB.cats; UID=null; S.view="boas"; render(); }
});
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("./service-worker.js").catch(()=>{}); });
}
boot();
</script>
